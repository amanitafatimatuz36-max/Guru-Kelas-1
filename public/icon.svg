<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#primaryGrad)"/>
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Open Book Symbol -->
  <path d="M120 340 C180 310, 240 320, 256 340 C272 320, 332 310, 392 340 L392 200 C332 170, 272 180, 256 200 C240 180, 180 170, 120 200 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M256 200 L256 340" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>

  <!-- Education Torch / Flame (Tut Wuri Handayani style aesthetic) -->
  <path d="M256 120 C240 150, 235 170, 256 195 C277 170, 272 150, 256 120 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="165" r="8" fill="#ef4444"/>

  <!-- Text elements / Banner -->
  <rect x="140" y="375" width="232" height="42" rx="21" fill="#ffffff"/>
  <text x="256" y="402" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#1e3a8a" letter-spacing="2">SDN KRATON 2</text>
</svg>
